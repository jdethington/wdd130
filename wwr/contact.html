<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Desert Surge Adventure</title>
    <meta name="description"
      content="Get in touch with Desert Surge Adventure for Arizona whitewater rafting questions, bookings, or group info. Call, email, or message us today!">
    <meta name="author" content="Jacob Dwayne Ethington">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingcompas.jpg" alt="Logo for Desert Surge Adventure">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="address">
            <h1>Desert Surge Adventure</h1>
            <p>123 Main River Street </p>
            <p>Kolob, Arizona</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>
        <div class="section2">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d387205.00572887086!2d-114.35878801346476!3d33.53896870009453!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sus!4v1770224467482!5m2!1sen!2sus"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            <form>
                <fieldset>
                    <div class="form-item column2">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name" autocomplete="name">
                    </div>
                    <div class="form-item column2">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" autocomplete="email">
                    </div>
                </fieldset>

                <fieldset>
                    <div class="form-item column2">
                        <p>Message Purpose</p>
                        <div>
                            <div class="form-item column3">
                                <input type="radio" name="purpose" id="inquery">
                                <label for="inquery">General Inquiry</label>
                            </div>
                            <div class="form-item column3">
                                <input type="radio" name="purpose" id="question">
                                <label for="question">Reservation Question</label>
                            </div>
                            <div class="form-item column3">
                                <input type="radio" name="purpose" id="suggestion">
                                <label for="suggestion">Website Suggestion</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-item">
                        <label for="message">Message</label>
                        <textarea name="message" id="message" rows="2"
                          placeholder="Type here"></textarea>
                    </div>
                    <div class="form-item column3">
                        <input type="checkbox" name="subscribe" id="subscribe">
                        <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                    </div>
                </fieldset>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div>
                <figure><img src="images/profile.jpg" alt="Employee 1">
                    <figcaption>Jacob Ethington</figcaption>
                </figure>
                <figure><img src="images/superstition-mountains.jpg" alt="Employee 3">
                    <figcaption>Nathan Ethington</figcaption>
                </figure>
                <figure><img src="images/profile.jpg" alt="Employee 2">
                    <figcaption>Sandi Brimhall</figcaption>
                </figure>
            </div>
        </section>

    </main>
    <footer>
        <p>&copy;2026 | Desert Surge Adventure | 🐄 Jacob Dwayne Ethington 🐮</p>
        <nav class="socialmedia">
            <a href="http://facebook.com" target="_blank"><img src="images/facebook-square.svg"
                  alt="Link to Facebook website"></a>
            <a href="http://linkedin.com" target="_blank"><img src="images/linkedin-square.svg"
                  alt="Link to LinkedIn website"></a>
            <a href="http://x.com" target="_blank"><img src="images/x-logo-icon.svg"
                  alt="Link to X website"></a>
        </nav>
    </footer>

</body>

</html>
